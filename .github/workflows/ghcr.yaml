name: ghcr

# Builds the classic hbbs/hbbr image (docker-classic/Dockerfile.source) natively on amd64 and
# arm64 and publishes a multi-arch manifest to ghcr.io/<owner>/rustdesk-server using only the
# repository's own GITHUB_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - 'scotcw/**'
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'docker-classic/Dockerfile.source'
      - '.github/workflows/ghcr.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rustdesk-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-classic/Dockerfile.source
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:secure-tcp" \
            -t "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:secure-tcp"
